services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/app:cached
    command: sleep infinity
    depends_on:
      - db

  db:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lucasrangel
      POSTGRES_PASSWORD: scrapyword
      POSTGRES_DB: scrapy_data
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: